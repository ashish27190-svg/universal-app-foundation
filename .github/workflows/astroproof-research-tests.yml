name: AstroProof Research Evaluator Tests

on:
  push:
    branches: [astroproof-research]
    paths:
      - 'research/astroproof/**'
      - '.github/workflows/astroproof-research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check evaluator scripts
        run: |
          node --check research/astroproof/evaluate-predictions.mjs
          node --check research/astroproof/evaluate-admission-pack.mjs
      - name: Test admission and leakage safeguards (fictional fixtures)
        run: node --test research/astroproof/tests/admission-pack.test.mjs
