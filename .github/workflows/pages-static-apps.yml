name: Deploy Hosted Static Apps

on:
  push:
    branches: [hosted-static-apps]
    paths:
      - 'site/**'
      - '.github/workflows/pages-static-apps.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hosted-static-apps-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate hosted static apps
        run: |
          test -s site/index.html
          test -s site/daily-intelligence/index.html
          test -s site/daily-intelligence/manifest.webmanifest
          test -s site/daily-intelligence/sw.js
          grep -q "Daily Intelligence" site/daily-intelligence/index.html
          grep -q "viewport" site/daily-intelligence/index.html
          test -s site/mantra-learning/index.html
          grep -q "MantraMitra" site/mantra-learning/index.html
          grep -q "viewport" site/mantra-learning/index.html
          test -s site/personal-coach/index.html
          grep -q "Personal Coach" site/personal-coach/index.html
          grep -q "viewport" site/personal-coach/index.html
          test -s site/astroproof/index.html
          grep -q "AstroProof" site/astroproof/index.html
          grep -q "viewport" site/astroproof/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
