name: Deploy Hosted Static Apps

on:
  push:
    branches: [hosted-static-apps]
    paths:
      - 'site/**'
      - '.github/workflows/pages-static-apps.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hosted-static-apps-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate hosted static apps
        run: |
          test -s site/index.html
          test -s site/daily-intelligence/index.html
          test -s site/daily-intelligence/manifest.webmanifest
          test -s site/daily-intelligence/sw.js
          grep -q "Daily Intelligence" site/daily-intelligence/index.html
          grep -q "viewport" site/daily-intelligence/index.html
          test -s site/mantra-learning/index.html
          grep -q "MantraMitra" site/mantra-learning/index.html
          grep -q "viewport" site/mantra-learning/index.html
          test -s site/personal-coach/index.html
          grep -q "Personal Coach" site/personal-coach/index.html
          grep -q "viewport" site/personal-coach/index.html
          test -s site/astroproof/index.html
          grep -q "AstroProof" site/astroproof/index.html
          grep -q "viewport" site/astroproof/index.html

      - name: Check AstroProof scripts and evidence workflow
        run: |
          node --check site/astroproof/app.js
          node --check site/astroproof/validation.js
          node site/astroproof/tests/validation-workspace.test.mjs

      - name: Browser QA — AstroProof evidence workflow
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            CHROME=google-chrome
          elif command -v chromium >/dev/null 2>&1; then
            CHROME=chromium
          else
            echo "No Chrome/Chromium browser available on runner"; exit 1
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site >/tmp/astroproof-qa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          sleep 2
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --virtual-time-budget=7000 \
            --window-size=800,960 --dump-dom \
            http://127.0.0.1:8765/astroproof/tests/browser-smoke.html \
            >/tmp/astroproof-browser-dom.html 2>/tmp/astroproof-browser-errors.log
          # Verify a RUN-TIME attribute on the rendered result element.
          # Searching for success text alone is unsafe: JavaScript source can contain it.
          if ! grep -Eq '<pre[^>]*id="result"[^>]*data-qa-state="pass"[^>]*data-qa-count="[1-9][0-9]*"' /tmp/astroproof-browser-dom.html; then
            echo "Browser QA did not reach a rendered pass state:"
            grep -o '<pre id="result"[^>]*>[^<]*' /tmp/astroproof-browser-dom.html | head -n 3 || true
            tail -n 30 /tmp/astroproof-browser-errors.log || true
            exit 1
          fi
          grep -o 'APV_BROWSER_PASS[^<]*' /tmp/astroproof-browser-dom.html | head -n 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
