name: Deploy Hosted Static Apps

on:
  push:
    branches: [hosted-static-apps]
    paths:
      - 'site/**'
      - '.github/workflows/pages-static-apps.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hosted-static-apps-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate Daily Intelligence static package
        run: |
          test -s site/daily-intelligence/index.html
          test -s site/daily-intelligence/manifest.webmanifest
          test -s site/daily-intelligence/sw.js
          grep -q "Daily Intelligence" site/daily-intelligence/index.html
          grep -q "viewport" site/daily-intelligence/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
