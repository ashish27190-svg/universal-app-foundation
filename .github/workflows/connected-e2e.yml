name: Connected E2E (Guarded Workflow Pending)

# P0 protective kill switch. Removes the old unconditional weekly schedule.
# Connected E2E requires isolated staging and two approved synthetic accounts;
# the revised manual-only guarded suite lives in draft PR #5.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse legacy connected staging tests
        run: |
          echo "::error::Connected E2E is disabled until protected UAF staging and both test accounts are explicitly approved."
          exit 1
