name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Require dependency lock
        run: test -f pnpm-lock.yaml || (echo 'pnpm-lock.yaml is required before CI can be green.' && exit 1)
      - run: pnpm install --frozen-lockfile
      - name: Enforce no direct package-script staging or production deployments
        run: node scripts/guard-release-scripts.mjs --self-test
      - name: Prove both direct deploy shortcuts reject execution (no credentials)
        run: |
          if pnpm deploy:staging; then
            echo "::error::Direct staging deploy unexpectedly succeeded."
            exit 1
          fi
          if pnpm deploy:production; then
            echo "::error::Direct production deploy unexpectedly succeeded."
            exit 1
          fi
          echo "PASS: both direct deployment scripts blocked without cloud access."
      - run: pnpm validate:structure
      - run: pnpm validate:core-boundary
      - run: pnpm validate:config-boundary
      - run: pnpm validate:auth-boundary
      - run: pnpm validate:data-boundary
      - run: pnpm validate:sync-boundary
      - run: pnpm validate:ui-boundary
      - run: pnpm validate:household-domain-boundary
      - run: pnpm validate:supabase-foundation
      - run: pnpm validate:household-supabase
      - run: pnpm validate:security
      - run: pnpm validate:conflict-resolution
      - run: pnpm validate:pwa-release
      - run: pnpm validate:monitoring
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
