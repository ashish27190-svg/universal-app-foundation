name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Require dependency lock
        run: test -f pnpm-lock.yaml || (echo 'pnpm-lock.yaml is required before CI can be green.' && exit 1)
      - run: pnpm install --frozen-lockfile
      - name: Enforce no direct package-script staging or production deployments
        run: node scripts/guard-release-scripts.mjs --self-test
      - name: Prove both direct deploy shortcuts reject execution (no credentials)
        run: |
          if pnpm deploy:staging; then
            echo "::error::Direct staging deploy unexpectedly succeeded."
            exit 1
          fi
          if pnpm deploy:production; then
            echo "::error::Direct production deploy unexpectedly succeeded."
            exit 1
          fi
          echo "PASS: both direct deployment scripts blocked without cloud access."
      - name: Verify isolated staging guard against synthetic configurations
        run: node scripts/validate-staging-readiness.mjs --self-test
      - name: Verify staging Access checks fail closed (synthetic)
        run: node scripts/verify-private-staging.mjs --self-test
      - name: Verify connected browser evidence gate rejects skips/flakes (synthetic)
        run: node scripts/validate-connected-e2e-results.mjs --self-test
      - name: Verify exact staging migration-set approval (synthetic)
        run: node scripts/validate-staging-migration-approval.mjs --self-test
      - name: Verify staging commit fingerprint rejects unreviewed candidates (synthetic)
        run: node scripts/validate-staging-candidate-approval.mjs --self-test
      - name: Reject unprotected branch, fork and nonmanual hosted staging contexts (synthetic)
        run: node scripts/validate-staging-github-context.mjs --self-test
      - name: Reject automatic staging/connected E2E/production workflow triggers
        run: |
          node scripts/validate-manual-workflow-triggers.mjs --self-test
          node scripts/validate-manual-workflow-triggers.mjs
      - run: pnpm validate:structure
      - run: pnpm validate:core-boundary
      - run: pnpm validate:config-boundary
      - run: pnpm validate:auth-boundary
      - run: pnpm validate:data-boundary
      - run: pnpm validate:sync-boundary
      - run: pnpm validate:ui-boundary
      - run: pnpm validate:household-domain-boundary
      - run: pnpm validate:supabase-foundation
      - run: pnpm validate:household-supabase
      - run: pnpm validate:security
      - run: pnpm validate:conflict-resolution
      - run: pnpm validate:pwa-release
      - run: pnpm validate:monitoring
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Discover nine connected browser journeys (no staging credentials)
        run: pnpm --filter @uaf/reference-app exec playwright test --list
