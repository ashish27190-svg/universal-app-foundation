name: Refresh Daily Intelligence News

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-intelligence-news.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hosted-static-apps-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out hosted app branch
        uses: actions/checkout@v4
        with:
          ref: hosted-static-apps
          fetch-depth: 0

      - name: Build fresh news cache
        run: python3 scripts/update_daily_intelligence_news.py

      - name: Validate Daily Intelligence cache
        run: |
          test -s site/daily-intelligence/news.json
          python3 - <<'PY'
          import json
          p='site/daily-intelligence/news.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('generatedAt'), 'generatedAt missing'
          assert len(d.get('items',[])) >= 20, 'too few news items'
          print('generatedAt:', d['generatedAt'])
          print('items:', len(d['items']))
          print('errors:', len(d.get('errors',[])))
          PY

      - name: Commit refreshed cache
        run: |
          git config user.name "daily-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/daily-intelligence/news.json
          if git diff --cached --quiet; then
            echo "No cache content change"
          else
            git commit -m "data: refresh Daily Intelligence news"
            git push origin HEAD:hosted-static-apps
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete hosted site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy refreshed site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

