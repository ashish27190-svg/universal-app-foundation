name: Refresh Daily Intelligence News

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-intelligence-news.yml'

permissions:
  contents: write

concurrency:
  group: daily-intelligence-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out hosted app branch
        uses: actions/checkout@v4
        with:
          ref: hosted-static-apps
          fetch-depth: 0

      - name: Build compact news cache
        run: python3 scripts/update_daily_intelligence_news.py

      - name: Commit refreshed cache
        run: |
          git config user.name "daily-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/daily-intelligence/news.json
          if git diff --cached --quiet; then
            echo "No news cache change"
            exit 0
          fi
          git commit -m "data: refresh Daily Intelligence news"
          git push origin HEAD:hosted-static-apps
