name: Deploy Production (Blocked Pending Release Assurance)

# P0 safeguard on the draft branch. Do not restore deployment until the
# production authorization, migration review, access policy, E2E evidence
# and rollback gates have passed and have separately approved implementation.
# This dispatch deliberately fails WITHOUT reading secrets or contacting
# Supabase, PowerSync or Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uaf-household-vault-production
  cancel-in-progress: false

jobs:
  no_production_deployment:
    name: Production release is explicitly blocked
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - name: Deny all production mutations until separately approved
        run: |
          echo "::error::PRODUCTION_RELEASE_BLOCKED: Private staging and hosted acceptance are incomplete. A separately reviewed production workflow is required."
          exit 1
