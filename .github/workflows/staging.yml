name: Deploy Staging (Guarded)

# Deliberately manual-only. A push to main must never automatically publish a
# potentially unprotected or disconnected staging app.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Run offline checks, inspect remote migration plan, or request separately approved private staging deployment"
        required: true
        type: choice
        default: preflight_only
        options:
          - preflight_only
          - plan_migrations
          - deploy_private_staging
      reviewed_migrations_sha256:
        description: "Exact SHA-256 from a separately reviewed plan_migrations run; required for deploy only"
        required: false
        type: string
        default: ''
      reviewed_candidate_sha:
        description: "Exact Git commit SHA from the same reviewed plan_migrations run; required for deploy only"
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: uaf-household-vault-staging
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate candidate without touching hosted services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-staging-readiness.mjs --self-test
      - run: node scripts/verify-private-staging.mjs --self-test
      - run: node scripts/validate-connected-e2e-results.mjs --self-test
      - run: node scripts/validate-staging-migration-approval.mjs --self-test
      - run: node scripts/validate-staging-candidate-approval.mjs --self-test
      - run: node scripts/validate-staging-github-context.mjs --self-test
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Discover browser journeys without starting staging services
        run: pnpm --filter @uaf/reference-app exec playwright test --list

  migration_plan:
    name: Preview ONLY isolated remote migrations (no apply, no publish)
    if: ${{ inputs.action == 'plan_migrations' && github.ref == 'refs/heads/main' && github.ref_protected }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Require protected main, exact repo and manual action before remote planning
        run: node scripts/validate-staging-github-context.mjs
      - name: Require only the exact isolated UAF database for the read-only plan
        run: node scripts/validate-staging-readiness.mjs --plan
      - name: Print reviewed candidate source commit before remote planning
        run: node scripts/validate-staging-candidate-approval.mjs --print
      - name: Print migration file-set digest for human review
        run: node scripts/validate-staging-migration-approval.mjs --print
      - name: Link only the approved staging database
        run: pnpm supabase --workdir infrastructure link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show migrations pending on that database; DO NOT apply
        run: pnpm supabase --workdir infrastructure db push --linked --dry-run

  deploy:
    name: Deploy only after reviewed migration plan and private Access approvals
    if: ${{ inputs.action == 'deploy_private_staging' && github.ref == 'refs/heads/main' && github.ref_protected }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      VITE_UAF_ENVIRONMENT: staging
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VITE_POWERSYNC_URL: ${{ secrets.STAGING_POWERSYNC_URL }}
      VITE_SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PRIVATE_ACCESS_CONFIRMED: ${{ secrets.STAGING_PRIVATE_ACCESS_CONFIRMED }}
      STAGING_PROTECTED_URL: ${{ secrets.STAGING_PROTECTED_URL }}
      STAGING_WORKERS_SUBDOMAIN: ${{ secrets.STAGING_WORKERS_SUBDOMAIN }}
      STAGING_ACCESS_TEAM_DOMAIN: ${{ secrets.STAGING_ACCESS_TEAM_DOMAIN }}
      STAGING_POWERSYNC_APPROVED_ORIGIN: ${{ secrets.STAGING_POWERSYNC_APPROVED_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Require protected main, exact repo and manual action before deployment
        run: node scripts/validate-staging-github-context.mjs
      - name: Refuse deployment of an unreviewed candidate commit
        env:
          REVIEWED_CANDIDATE_SHA: ${{ inputs.reviewed_candidate_sha }}
        run: node scripts/validate-staging-candidate-approval.mjs --verify
      - name: Require independently reviewed exact migration file-set
        env:
          REVIEWED_MIGRATIONS_SHA256: ${{ inputs.reviewed_migrations_sha256 }}
        run: node scripts/validate-staging-migration-approval.mjs --verify
      - name: Validate only the dedicated UAF staging project is configured
        run: node scripts/validate-staging-readiness.mjs --deploy
      - name: Require approved Cloudflare Access across all four anonymous paths
        run: node scripts/verify-private-staging.mjs
      - name: Build with staging public configuration
        run: pnpm --filter @uaf/reference-app build
      - name: Review pending migrations for the isolated UAF staging project
        run: |
          # --workdir is required: the checked-in Supabase config/migrations live in infrastructure/.
          # SUPABASE_DB_PASSWORD stays in the environment instead of a CLI argument.
          pnpm supabase --workdir infrastructure link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm supabase --workdir infrastructure db push --linked --dry-run
      - name: Refuse changed migrations before approved database write
        env:
          REVIEWED_MIGRATIONS_SHA256: ${{ inputs.reviewed_migrations_sha256 }}
        run: node scripts/validate-staging-migration-approval.mjs --verify
      - name: Apply reviewed staging migrations (manual protected job only)
        run: pnpm supabase --workdir infrastructure db push --linked
      - name: Deploy UAF Edge Functions only to dedicated staging
        run: |
          pnpm supabase --workdir infrastructure functions deploy sync-apply --project-ref "$SUPABASE_PROJECT_REF"
          pnpm supabase --workdir infrastructure functions deploy resolve-conflict --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy private Cloudflare staging PWA
        # IMPORTANT: Cloudflare Access policy is configured/verified outside
        # this workflow. A confirmation secret is a human release gate, not
        # cryptographic verification of the Access policy.
        run: pnpm wrangler deploy --config apps/reference-app/wrangler.jsonc --env staging
      - name: Verify approved Access blocks every anonymous probe after deployment
        run: node scripts/verify-private-staging.mjs
