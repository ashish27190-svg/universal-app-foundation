name: Deploy Staging (Guarded Workflow Pending)

# P0 protective kill switch. This replaces the legacy push-to-main staging
# deployment trigger WITHOUT activating services, running migrations, or
# publishing a site. It must remain inert until PR #5's reviewed guarded
# workflow is separately approved and promoted.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse legacy staging deployment
        run: |
          echo "::error::UAF staging deployment is disabled. The isolated staging database is inactive. Review Gate 3 approvals and the guarded workflow in draft PR #5."
          exit 1
