name: Gate 2 Local Supabase

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gate2-local-supabase.yml'
      - 'infrastructure/supabase/**'
      - 'scripts/gate2-local-db.sh'
      - 'scripts/gate2-local-functions.mjs'

permissions:
  contents: read

jobs:
  local-db-security:
    name: Local database migration + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run disposable local Gate-2 database checks
        run: bash scripts/gate2-local-db.sh
      - name: Stop disposable local database
        if: always()
        run: |
          cd infrastructure
          ../node_modules/.bin/supabase stop --no-backup || true
