<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AstroProof Browser Smoke — Synthetic QA</title>
<style>body{font:15px system-ui,sans-serif;padding:12px;margin:0}iframe{border:1px solid #999;width:390px;max-width:100%;height:680px}pre{white-space:pre-wrap}</style></head>
<body><h1>AstroProof Browser Smoke — Fictional Data Only</h1>
<pre id="result">APV_BROWSER_PENDING</pre>
<iframe id="application" src="../index.html" title="AstroProof test frame"></iframe>
<script>
'use strict';
const status=document.getElementById('result');
const checks=[];
const assert=(condition,message)=>{if(!condition)throw new Error(message);checks.push(message)};
const fill=(form,name,value)=>{
  const el=form.elements.namedItem(name);
  if(!el)throw new Error('Form field unavailable: '+name);
  el.value=value;
  el.dispatchEvent(new Event('change',{bubbles:true}));
};
async function run(){
  const frame=document.getElementById('application');
  const w=frame.contentWindow,doc=frame.contentDocument;
  w.confirm=()=>true; // Synthetic QA only.
  const nav=doc.querySelector('[data-page="validation"]');
  assert(!!nav,'Validation menu exists');
  assert(!!w.AstroProofValidation,'Validation module initialized');
  nav.click();
  assert(doc.querySelector('#validation')?.classList.contains('active'),'Evidence workspace opens through navigation');
  let root=doc.querySelector('#apv-root');
  assert(!!root.querySelector('[data-apv-tab="events"]'),'Event archive tab exists');
  assert(w.AstroProofValidation.getSummary().progress_percent===0,'Empty browser starts with 0% evidence progress');
  const initialDigest=await w.AstroProofValidation.getIntegrityDigest();
  assert(/^[0-9a-f]{64}$/.test(initialDigest),'Secure SHA-256 checksum generated for local archive');
  root.querySelector('[data-apv-tab="events"]').click();
  let form=root.querySelector('#apv-new-event');
  assert(!!form,'Event entry form opens');
  fill(form,'event_type','promotion');
  fill(form,'life_area','career');
  fill(form,'event_start','2024-05-15');
  fill(form,'date_precision','exact');
  fill(form,'purpose','validation_holdout');
  fill(form,'source_kind','personal_recollection');
  fill(form,'note','Synthetic promotion, not a real user event');
  form.requestSubmit();
  assert(w.AstroProofValidation.getSummary().events===1,'Fictional event records locally');
  assert(w.AstroProofValidation.getSummary().progress_percent===0,'Unreviewed event cannot advance evidence progress');
  const eventDigest=await w.AstroProofValidation.getIntegrityDigest();
  assert(eventDigest!==initialDigest,'Adding a factual event changes the archive integrity digest');
  root.querySelector('[data-apv-tab="predictions"]').click();
  form=root.querySelector('#apv-new-prediction');
  assert(!!form,'Prediction draft form opens');
  fill(form,'life_area','career');
  fill(form,'specificity_class','specific');
  fill(form,'claim','Synthetic signed employment offer');
  fill(form,'pass_fail_criteria','Signed document received in target window');
  fill(form,'window_start','2090-04-10');
  fill(form,'window_end','2090-04-20');
  fill(form,'calculation_version','synthetic-browser-fixture');
  fill(form,'source_ref','synthetic-source-not-real');
  fill(form,'rule_ids','FICTIONAL-UI-001');
  fill(form,'assumptions','Synthetic-only test, not a genuine forecast');
  form.requestSubmit();
  assert(w.AstroProofValidation.getSummary().predictions===1,'Draft prediction saved');
  assert(w.AstroProofValidation.getSummary().progress_percent===0,'Draft prediction does not count as frozen evidence');
  const freeze=root.querySelector('[data-apv-action="freeze"]');
  assert(!!freeze,'Freeze action is visible');
  freeze.click();
  assert(root.textContent.includes('Frozen · not validated'),'Prediction visibly frozen without validation');
  const frozenDigest=await w.AstroProofValidation.getIntegrityDigest();
  assert(frozenDigest!==eventDigest,'Freezing a forecast changes the archived snapshot digest');
  const followup=w.AstroProofValidation.getFollowupSummary();
  assert(followup.counts.future===1,'Future forecast is tracked without outcome status');
  root.querySelector('[data-apv-tab="followups"]').click();
  assert(root.textContent.includes('Forecast follow-up queue'),'A new user can open the follow-up worklist');
  root.querySelector('[data-apv-tab="cases"]').click();
  let caseForm=root.querySelector('#apv-new-case');
  assert(!!caseForm,'Outcome comparison form is accessible');
  const choice=caseForm.elements.namedItem('prediction_id');
  assert(choice?.options.length>1,'Frozen prediction appears in case selection');
  fill(caseForm,'prediction_id',choice.options[1].value);
  fill(caseForm,'observation','Synthetic pending outcome, not a real event');
  caseForm.requestSubmit();
  assert(w.AstroProofValidation.getSummary().cases===1,'Incomplete outcome case is stored as pending');
  root.querySelector('[data-apv-tab="review"]').click();
  let evidenceForm=root.querySelector('#apv-add-case-evidence');
  assert(!!evidenceForm,'Pending case evidence addendum form is available');
  const caseChoice=evidenceForm.elements.namedItem('case_id');
  assert(caseChoice?.options.length>1,'Pending case is selectable for evidence addendum');
  fill(evidenceForm,'case_id',caseChoice.options[1].value);
  fill(evidenceForm,'evidence_ref','synthetic-evidence-pointer');
  fill(evidenceForm,'note','Synthetic dated addendum, no real evidence verified');
  evidenceForm.requestSubmit();
  const savedArchive=JSON.parse(w.localStorage.getItem('astroproof.validation.v1'));
  assert(savedArchive.cases[0].evidence_addenda.length===1,'Evidence addendum is actually persisted');
  assert(w.AstroProofValidation.getSummary().prospective_matches===0 &&
    w.AstroProofValidation.getSummary().prospective_misses===0,
    'Appending an evidence pointer never automatically verifies a prediction');
  const m=doc.documentElement.scrollWidth;
  const frameWidth=frame.clientWidth;
  assert(m<=frameWidth+25,'Mobile-sized layout has no major horizontal overflow: '+m+'px vs '+frameWidth+'px');
  const summary=w.AstroProofValidation.getSummary();
  assert(summary.prospective_matches===0&&summary.prospective_misses===0,'No match or miss fabricated by UI');

  // Exercise migration through the actual rendered app, using fictional records only.
  root.querySelector('[data-apv-tab="predictions"]').click();
  form=root.querySelector('#apv-new-prediction');
  for(const [name,value] of Object.entries({
    life_area:'career',specificity_class:'specific',claim:'Synthetic retired-engine prediction',
    pass_fail_criteria:'Fictional test criterion',window_start:'2090-04-10',window_end:'2090-04-20',
    calculation_version:'astroproof-hosted-provisional-1.0',source_ref:'fictional-legacy-source',rule_ids:'FICTIONAL-OLD-1'
  }))fill(form,name,value);
  form.requestSubmit();
  const legacyRecord=JSON.parse(w.localStorage.getItem('astroproof.validation.v1')).predictions.find(p=>p.claim==='Synthetic retired-engine prediction');
  assert(!!legacyRecord,'Legacy fixture is stored for migration test');
  root.querySelector('[data-apv-action="freeze"][data-id="'+legacyRecord.prediction_id+'"]').click();
  const savedLegacy=JSON.parse(w.localStorage.getItem('astroproof.validation.v1')).predictions.find(p=>p.prediction_id===legacyRecord.prediction_id);
  assert(savedLegacy.status==='frozen','Original old-engine record remains frozen');
  assert(w.AstroProofValidation.getSummary().legacy_quarantined===1,'Old-engine record excluded from scoring');
  assert(w.AstroProofValidation.getFollowupSummary().items.find(p=>p.prediction_id===legacyRecord.prediction_id).state==='integrity_blocked','Legacy forecast shows blocked follow-up state');
  doc.querySelector('[data-page="profile"]').click();
  for(const [id,value] of Object.entries({'birthdate':'2024-01-01','birthtime':'17:30','birth-name':'ALICE','preset':'Delhi'})){
    const el=doc.getElementById(id);el.value=value;el.dispatchEvent(new Event('change',{bubbles:true}));
  }
  doc.getElementById('consent').checked=true;
  doc.getElementById('birth-form').requestSubmit();
  const calc=w.AstroProofBridge.getChartSummary();
  assert(calc?.ascendant==='Gemini','Corrected synthetic Vedic Ascendant is Gemini, not Sagittarius');
  assert(calc.calculation_version==='astroproof-browser-calculation-2026-11-21-v1.1','Chart version is recorded');
  doc.querySelector('[data-page="charts"]').click();
  assert(doc.querySelector('#charts-area').textContent.includes('Engine self-test: PASS'),'Actual chart self-test renders PASS');
  assert(doc.querySelector('#charts-area').textContent.includes('Ascendant: Cancer 10.'),'Corrected tropical Ascendant renders in Cancer');
  assert(doc.querySelector('#charts-area').textContent.includes('Chaldean compound/reduced: 13/4'),'Chaldean result renders separately');
  assert(doc.querySelector('#charts-area').textContent.includes('Year: Gui Mao'),'Li Chun previous solar-year pillar renders');
  assert(doc.querySelector('#charts-area').textContent.includes('Month:'),'BaZi month pillar renders');
  w.localStorage.removeItem('astroproof.web.v05');

  w.localStorage.removeItem('astroproof.validation.v1');
  status.setAttribute('data-qa-state','pass');
  status.setAttribute('data-qa-count',String(checks.length));
  status.textContent='APV_'+'BROWSER_PASS — '+checks.length+' browser assertions\n'+checks.join('\n');
}
window.addEventListener('load',()=>{
  Promise.resolve().then(run).catch(e=>{
    status.setAttribute('data-qa-state','fail');
    status.textContent='APV_'+'BROWSER_FAIL — '+String(e.stack||e);
  });
});
</script></body></html>
